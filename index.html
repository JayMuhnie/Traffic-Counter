<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TMC Counter">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>TMC Counter</title>
<style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--car:#2563eb;--truck:#ea580c;--bus:#16a34a;--bike:#7c3aed;--ped:#0d9488;--dark:#0f172a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:16px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
input{font:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.35}

/* header */
.top{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--dark);color:#fff;padding:10px 14px}
.top .ti{flex:1 1 220px;min-width:0}
.site{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:#cbd5e1;font-size:14px}
.tot{display:flex;gap:8px}
.pill{border-radius:999px;padding:5px 12px;font-size:14px;color:#fff}
.pill b{font-size:18px;margin-left:4px}
.pill.veh{background:var(--car)}.pill.bike{background:var(--bike)}.pill.ped{background:var(--ped)}
.acts{display:flex;gap:8px}
.hb{background:#1e293b;color:#fff;border:0;border-radius:10px;padding:10px 14px;min-height:44px;font-weight:700;font-size:15px}
.hb.stop{background:#b91c1c}
.hb.dark{background:var(--dark)}
#banner:not(:empty){background:#fef3c7;color:#92400e;padding:10px 14px;font-weight:700;text-align:center}

/* mode + class selectors */
.modes,.classes{display:flex;gap:8px;padding:10px 12px 0}
.modes button,.classes button{flex:1;min-height:56px;border:2px solid transparent;border-radius:14px;background:#fff;color:var(--ink);font-weight:800;font-size:18px}
.classes button{min-height:48px;font-size:17px}
.modes button.on[data-mode=veh]{background:var(--car);color:#fff}
.modes button.on[data-mode=b]{background:var(--bike);color:#fff}
.modes button.on[data-mode=p]{background:var(--ped);color:#fff}
.classes button[data-cls=car]{border-color:var(--car)}.classes button[data-cls=truck]{border-color:var(--truck)}.classes button[data-cls=bus]{border-color:var(--bus)}
.classes button.on[data-cls=car]{background:var(--car);color:#fff}
.classes button.on[data-cls=truck]{background:var(--truck);color:#fff}
.classes button.on[data-cls=bus]{background:var(--bus);color:#fff}

/* count screen layout */
.cv{display:flex;flex-direction:column;overflow:hidden;height:100vh;height:var(--app-h,100vh);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html.cvmode,html.cvmode body{overflow:hidden;height:100%;height:var(--app-h,100%);padding:0}
.ivn{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:17px}
.ivn b{min-width:112px;text-align:center}
.hb.sm{padding:6px 14px;min-height:40px}
.hb.live{background:#16a34a}
.hb:disabled{opacity:.35}
.rmrow{padding:0}
#rmbtn{width:100%;min-height:46px;border:2px solid #b91c1c;border-radius:14px;background:#fff;color:#b91c1c;font-weight:800;font-size:16px}
#rmbtn.on{background:#b91c1c;color:#fff}
.stage.past{background:#f1deb0}
.stage.rm{background:#f1c4c4}
#banner.rmb:not(:empty){background:#fee2e2;color:#991b1b}
.nogap .ivn>*+*{margin-left:8px}
.cmain{flex:1;min-height:0;display:flex;flex-direction:column}
.ctl{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 12px;overflow:auto}
.ctl .modes,.ctl .classes{padding:0}
.ctl .modes button{min-height:52px;font-size:17px}
.ctl .classes button{min-height:46px}
@media (orientation:landscape){
  .cmain{flex-direction:row}
  .ctl{width:176px;padding:10px 0 10px 12px}
  .ctl .modes,.ctl .classes{flex-direction:column}
}
.stage{flex:1;min-height:0;min-width:0;display:flex;background:#dde7d6}
.isec{display:block;width:100%;height:100%}

/* intersection diagram */
.isec .rd{fill:#4b5563}
.isec .cl{stroke:#fbbf24;stroke-width:5;stroke-dasharray:24 18}
.isec .zb{fill:#fff;opacity:.28}
.pedmode .isec .zb{opacity:.85}
.isec .rlp{fill:#0f172a;opacity:.92}
.isec .rlt{fill:#fff;font-weight:700;text-anchor:middle}
.isec .cmp{fill:#fff;opacity:.85}
.isec .cmpn{fill:#0f172a}
.isec .cmpt{fill:#0f172a;font-size:24px;font-weight:800;text-anchor:middle}
.mv{cursor:pointer}
.mv .bg{fill:var(--c)}
.mv.u .bg{opacity:.78}
.mv .flash{fill:#fff;opacity:0;transition:opacity .3s}
.mv.hit .flash{opacity:.6;transition:none}
.mv .rg0,.mv .rg1{fill:none;stroke:transparent}
.mv.lastb .rg0{stroke:#0f172a;stroke-width:11}
.mv.lastb .rg1{stroke:#facc15;stroke-width:5}
.mv text{fill:#fff;text-anchor:middle;font-weight:800;pointer-events:none}
.mv .lb{font-size:15px;letter-spacing:.04em;opacity:.95}
.mv .n{font-size:32px}
.mv .ic{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.mv .ich{fill:#fff;pointer-events:none}

/* leg editor preview */
.pv{max-width:300px;margin:0 auto 12px;background:#dde7d6;border-radius:14px;overflow:hidden}
.pv .isec{height:auto}
.legrow select{padding:12px 6px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;background:#fff;color:var(--ink)}

/* class selector + bike bubbles + crosswalk buttons */
.ctl .classes button{min-height:56px;font-size:17px}
.classes button[data-cls=bike]{border-color:var(--bike)}
.classes button.on[data-cls=bike]{background:var(--bike);color:#fff}
.clshint{margin:2px 2px 0;font-size:12px;color:var(--mut);line-height:1.3}
.mv.pd .bg{fill:var(--ped)}
.mv .bk circle{fill:var(--bike);stroke:#fff;stroke-width:3}
.mv .bk text{font-size:19px}

/* older Safari (before 14.1) has no flex "gap": fall back to margins (class set by a script at the bottom of the page) */
.nogap .top>*{margin:0 12px 6px 0}
.nogap .tot>*+*,.nogap .acts>*+*,.nogap .last>*+*,.nogap .row>*+*,.nogap .hrow>*+*,.nogap .rrow>*+*,.nogap .nrow>*+*,.nogap .legrow>*+*,.nogap .modes>*+*,.nogap .classes>*+*{margin-left:8px}
.nogap .cs>*+*{margin-left:4px}
.nogap .chips>*{margin:0 6px 6px 0}
.nogap label.chk>*+*{margin-left:10px}
.nogap .ctl>*+*{margin-top:8px}
.nogap .row{margin-bottom:6px}
@media (orientation:landscape){.nogap .modes>*+*,.nogap .classes>*+*{margin-left:0;margin-top:8px}}

/* pages / cards */
.page{max-width:980px;margin:0 auto;padding:16px}
h1{margin:6px 0 14px;font-size:26px}
h2{margin:0 0 6px;font-size:18px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin-bottom:10px}
label input[type=text],label input:not([type]){display:block;width:100%;margin-top:4px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px;font-weight:400}
label.chk{display:flex;gap:10px;align-items:center;margin:0}
label.chk input{width:24px;height:24px}
.hint{color:var(--mut);font-size:14px;margin:4px 0}
.big{width:100%;min-height:64px;border:0;border-radius:16px;font-size:22px;font-weight:800;color:#fff;background:var(--car);margin:6px 0 10px}
.big.go{background:#16a34a}
.ghost{background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.foot{color:var(--mut);font-size:13px;text-align:center;margin-top:18px}

/* leg editor */
.legrow{display:flex;gap:6px;margin-bottom:8px}
.legrow input{flex:1;min-width:0;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:17px}
.legrow button{width:48px;border:1px solid #cbd5e1;background:#fff;border-radius:10px;font-size:18px}
.legrow .del{color:#b91c1c}
.add{width:100%}

/* sheet */
#sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(15,23,42,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:88vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:18px}
.sb{padding:14px 16px calc(14px + env(safe-area-inset-bottom));overflow:auto}
.hrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.hrow .hi{flex:1;min-width:0}
.hrow .hi small{display:block;color:var(--mut)}

/* results */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.kpi small{color:var(--mut);display:block}
.kpi b{font-size:26px}
.warn{background:#fef3c7;color:#92400e;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:13px;color:var(--mut)}
tr.pk td{background:#fef3c7;font-weight:700}
tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.scroll{overflow-x:auto}
td small{color:var(--mut);display:block;font-size:11px}
/* last counted bar, recent list, notes */
.last{flex:1 1 100%;display:flex;align-items:center;gap:8px;background:#1e293b;border-radius:12px;padding:6px 6px 6px 12px}
.last .hb{background:#334155}
.lt{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last.pulse{animation:pulse .6s ease-out}
@keyframes pulse{0%{background:#64748b}100%{background:#1e293b}}
.mut{color:#94a3b8}
.chip{display:inline-block;border-radius:8px;padding:1px 8px;font-weight:800;color:#fff;margin-right:6px}
.chip.car{background:var(--car)}.chip.truck{background:var(--truck)}.chip.bus{background:var(--bus)}.chip.bike{background:var(--bike)}.chip.ped{background:var(--ped)}
.rrow,.nrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.ri,.ni{flex:1;min-width:0}
.ri small,.ni small{display:block;color:var(--mut)}
.cs{display:flex;gap:4px}
.cb{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 10px;min-height:40px;font-weight:700;color:var(--ink)}
.cb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ghost.del{width:44px;padding:8px 0;color:#b91c1c}
textarea{display:block;width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin:10px 0;-webkit-user-select:text;user-select:text}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid #cbd5e1;background:#fff;border-radius:999px;padding:8px 12px;font-weight:600;color:var(--ink)}
.nline{margin:6px 0}.nline small{color:var(--mut);margin-right:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:90%;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.95}

/* v7: slimmer chrome so the diagram gets the space */
.top{padding:5px 10px;gap:4px 12px}
.top .ti{flex:1 1 110px}
.site{font-size:16px}
.sub{font-size:12px}
.ivn{margin:0;gap:6px;font-size:16px}
.ivn b{min-width:100px}
.hb{min-height:38px;padding:5px 11px;font-size:14px;border-radius:9px}
.hb.sm{min-height:36px;padding:4px 12px}
.acts{gap:6px}.tot{gap:6px}
.pill{padding:2px 10px;font-size:13px}.pill b{font-size:16px}
.last{padding:3px 4px 3px 10px}
.last .hb{min-height:32px;padding:3px 10px}
.lt{font-size:14px}
.clshint{display:none}
.stage{position:relative}
#banner{position:absolute;left:0;right:0;top:0;z-index:4;pointer-events:none;opacity:.96}
#banner:not(:empty){padding:6px 10px;font-size:14px}
.ctl{flex-direction:row;align-items:center;gap:8px;padding:6px 10px}
.ctl .modes,.ctl .classes{flex:1;padding:0}
.ctl .classes button,.ctl .modes button{min-height:44px;font-size:16px}
.rmrow{flex:none;width:150px}
#rmbtn{min-height:44px;font-size:14px}
.nogap .ctl>*+*{margin-top:0;margin-left:8px}
@media (orientation:landscape){
  .ctl{flex-direction:column;align-items:stretch;width:128px;padding:8px 0 8px 8px}
  .rmrow{width:auto}
  .ctl .classes button,.ctl .modes button{min-height:52px;font-size:15px}
  .nogap .ctl>*+*{margin-left:0;margin-top:8px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
(function(){try{var d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
d.appendChild(document.createElement('i'));d.appendChild(document.createElement('i'));document.body.appendChild(d);
var ok=d.scrollHeight===1;document.body.removeChild(d);if(!ok)document.documentElement.className+=' nogap';}catch(e){}})();
</script>
<script src="analysis.js"></script>
<script src="app.js"></script>
</body>
</html>
